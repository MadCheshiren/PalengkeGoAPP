name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  analyze-test-build:
    name: Analyze, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Secret hygiene check
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files=(
            ".env"
            ".env.local"
            "android/key.properties"
            "android/app/google-services.json"
            "ios/Runner/GoogleService-Info.plist"
            "lib/firebase_options.dart"
          )

          for file in "${forbidden_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "::error file=$file::Secret/config file must not be committed. Use GitHub Secrets or local-only setup."
              exit 1
            fi
          done

          scan_dirs=()
          for dir in lib android ios test; do
            if [[ -d "$dir" ]]; then
              scan_dirs+=("$dir")
            fi
          done

          if grep -RInE "(service_role|PAYMONGO_SECRET|sk_live_|sk_test_)" "${scan_dirs[@]}" --exclude-dir=build --exclude-dir=.dart_tool; then
            echo "::error::Potential backend/payment secret found in source-controlled app files."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
